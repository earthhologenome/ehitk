name: Update database list

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  update-db-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Refresh database list from Zenodo
        run: python scripts/update_db_list.py

      - name: Open a pull request if the list changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update published database list from Zenodo"
          title: "Update published database list"
          body: |
            Automated refresh of the published database versions table
            (README and docs) from the Zenodo database concept.
          branch: chore/update-db-list
          delete-branch: true
          add-paths: |
            README.md
            docs/database.rst
