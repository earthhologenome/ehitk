{% set name = "ehitk" %}
{% set version = "1.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: afb2e0fa6fab357e46d96be497d998ce51504bf0e0aff58c7acacafa9ca961e6

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - ehitk = ehitk.cli:app

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=69
    - wheel
  run:
    - python >=3.10
    - requests >=2.31.0
    - rich >=13.7.0
    - typer >=0.12.0

test:
  imports:
    - ehitk
  commands:
    - ehitk --version
    - ehitk --help

about:
  home: https://github.com/earthhologenome/ehitk
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Earth Hologenome Initiative Toolkit
  description: |
    EHItk is a Python package and command-line tool for finding,
    summarizing, exporting, and downloading Earth Hologenome Initiative
    specimens, hologenomes, and metagenome-assembled genomes.
  doc_url: https://ehitk.readthedocs.io/
  dev_url: https://github.com/earthhologenome/ehitk

extra:
  recipe-maintainers:
    - anttonalberdi
